name: Plugin Security Scan

on: [pull_request, push]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f
        with:
          plugin_dir: "./plugins/shadowclone"
          min_score: 90
          fail_on_severity: medium
          pr_comment: "off"
