name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  gate:
    needs: prepare
    if: needs.prepare.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [prepare, gate]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Match the tag to the package version
        run: |
          version="$(bun --print 'require("./package.json").version')"
          tag="${{ needs.prepare.outputs.tag }}"
          if [ "${tag#v}" != "$version" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
