name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.pending.outputs.tag }}
      cli_missing: ${{ steps.pending.outputs.cli_missing }}
      skills_missing: ${{ steps.pending.outputs.skills_missing }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile

      - name: Find an unpublished release at this commit
        id: pending
        run: |
          version="$(node -p 'require("./packages/core/src/product.json").version')"
          tag="v$version"
          if ! git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "$tag does not exist yet"
            exit 0
          fi
          if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "$tag belongs to another commit"
            exit 0
          fi
          bun run tooling/src/releasePackages.ts >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare, gate]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    env:
      TURBO_FORCE: true
      TURBO_TELEMETRY_DISABLED: 1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run stage

      - name: Match the tag to the package version
        run: |
          version="$(bun --print 'require("./packages/core/src/product.json").version')"
          staged="$(bun --print 'require("./packages/cli/out/package/package.json").version')"
          skills="$(bun --print 'require("./packages/skills/out/package/package.json").version')"
          tag="${{ needs.prepare.outputs.tag }}"
          if [ "${tag#v}" != "$version" ] || [ "$staged" != "$version" ] || [ "$skills" != "$version" ]; then
            echo "tag $tag, product.json version $version, and staged versions $staged and $skills must match" >&2
            exit 1
          fi

      - name: Publish CLI to npm
        if: needs.prepare.outputs.cli_missing == 'true'
        run: npm publish ./packages/cli/out/package --access public --provenance

      - name: Publish skills to npm
        if: needs.prepare.outputs.skills_missing == 'true'
        run: npm publish ./packages/skills/out/package --access public --provenance

  image:
    needs: [prepare, publish]
    if: needs.prepare.outputs.tag != ''
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for the CLI version on npm
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@shadowclone/cli@${TAG#v}" version >/dev/null 2>&1; then exit 0; fi
            echo "Waiting for @shadowclone/cli@${TAG#v} on npm ($attempt)"
            sleep 20
          done
          exit 1

      - name: Build and push the clone image for ${{ matrix.arch }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/shadowclone-clone:${TAG#v}-$ARCH"
          printenv GH_TOKEN | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg "SHADOWCLONE_VERSION=${TAG#v}" --tag "$image" packages/clones/image
          docker push "$image"

  image-manifest:
    needs: [prepare, image]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Join the clone images into one tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/shadowclone-clone:${TAG#v}"
          printenv GH_TOKEN | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
