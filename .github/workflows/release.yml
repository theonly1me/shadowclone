name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  gate:
    needs: prepare
    if: needs.prepare.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prepare, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile

      - name: Match the tag to the package version
        if: needs.prepare.outputs.released == 'true'
        run: |
          version="$(bun --print 'require("./package.json").version')"
          tag="${{ needs.prepare.outputs.tag }}"
          if [ "${tag#v}" != "$version" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: bun run build

      - name: Run the built linux binary
        run: dist/linux-x64/shadowclone

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shadowclone-release
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/npm/**

      - name: Attach the binaries to the release
        if: needs.prepare.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            dist/*.tar.gz dist/SHA256SUMS.txt --clobber

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shadowclone-release
          path: dist

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set, so the npm packages were not published" >&2
            exit 1
          fi
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            npm publish "dist/npm/$platform" --access public --provenance
          done
          npm publish dist/npm/launcher --access public --provenance
