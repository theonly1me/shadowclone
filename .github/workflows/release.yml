name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile

      - name: Match the tag to the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(bun --print 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: bun run build

      - name: Run the built linux binary
        run: dist/linux-x64/shadowclone

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shadowclone-binaries
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish the npm packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set, so the npm packages were not published" >&2
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            npm publish "dist/npm/$platform" --access public --provenance
          done
          npm publish dist/npm/launcher --access public --provenance

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

              npm i -g @shadowclone/cli
              shadowclone doctor

          Or download a binary directly:

              curl -fL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/shadowclone-darwin-arm64.tar.gz | tar xz
              ./shadowclone doctor

          Builds are published for darwin-arm64, darwin-x64, linux-x64, and linux-arm64. The binaries are unsigned, so macOS Gatekeeper needs xattr -d com.apple.quarantine shadowclone on a downloaded copy.

          ## Verify

              gh attestation verify shadowclone-darwin-arm64.tar.gz --repo $GITHUB_REPOSITORY
              shasum -a 256 -c SHA256SUMS.txt
          NOTES

          arguments=()
          case "$GITHUB_REF_NAME" in
            *-*) arguments+=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${arguments[@]}"
