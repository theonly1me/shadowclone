<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan review</title>
<style>
:root {
  --page: #fbfaf7; --text: #1d1d1b; --muted: #66645f; --card: #ffffff; --line: #e2dfd8; --soft: #f3f1ec;
  --done: #2f7d4f; --doing: #a8701c; --todo: #77756f; --blocked: #b5443b; --skipped: #6d5fa8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #161615; --text: #ecebe7; --muted: #a09e98; --card: #1f1f1d; --line: #34332f; --soft: #262624;
    --done: #5fbf83; --doing: #e0a84a; --todo: #8f8c85; --blocked: #e57b72; --skipped: #a99be8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 25px; margin: 0 0 6px; } h2 { font-size: 18px; margin: 34px 0 10px; }
h3 { font-size: 15px; margin: 16px 0 6px; color: var(--muted); } p { margin: 0 0 10px; } a { color: inherit; }
nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 14px 0 0; }
.meta, .note, .counts span { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
.counts b { display: block; font-size: 22px; } .scroll { overflow-x: auto; } ul { margin: 0; padding-left: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; } th { color: var(--muted); font-weight: 600; }
code, pre { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
code { background: var(--soft); padding: 1px 4px; border-radius: 4px; } pre { white-space: pre-wrap; margin: 0; }
.status { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.done, .approved { color: var(--done); } .doing, .draft, .in-progress { color: var(--doing); } .todo { color: var(--todo); }
.blocked { color: var(--blocked); } .skipped { color: var(--skipped); }
#diagram img { display: block; max-width: 100%; height: auto; margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p><span id="status"></span></p>
  <p id="summary"></p>
  <p class="meta">Plan file: <code id="plan-path"></code>. Updated: <span id="updated"></span>.</p>
  <nav id="contents"></nav>
  <div class="counts" id="counts"></div>
  <div id="sections"></div>
</main>
<script type="application/json" id="plan">
{
  "title": "TEMPLATE: A short name for the change",
  "status": "draft",
  "summary": "TEMPLATE: Two or three sentences: what changes, why, and the result for the user.",
  "planPath": "TEMPLATE: The absolute path of the plan file",
  "updated": "TEMPLATE: The date and time of this update",
  "problem": { "statement": "TEMPLATE: What is wrong or missing, as the user sees it.", "impact": "TEMPLATE: Who it affects, how often, and what it costs them." },
  "evidence": [
    { "fact": "TEMPLATE: One thing that happened or that you observed.", "source": "TEMPLATE: A path:line, a command and its output, or a URL", "kind": "measured" }
  ],
  "causes": [
    { "id": "C1", "cause": "TEMPLATE: Why the problem happens.", "origin": "TEMPLATE: The path:line where the behavior first goes wrong" }
  ],
  "ruledOut": [
    { "cause": "TEMPLATE: A cause that you tested and rejected.", "reason": "TEMPLATE: The observation that ruled it out." }
  ],
  "approach": "TEMPLATE: The fix in one short paragraph.",
  "changes": [
    { "id": "F1", "change": "TEMPLATE: One change.", "files": ["TEMPLATE: path/to/file"], "addresses": ["C1"], "worksBecause": "TEMPLATE: Why this change removes the cause." }
  ],
  "alternatives": [
    { "option": "TEMPLATE: Another way, or no change.", "tradeoff": "TEMPLATE: What it gives, what it costs, and why the plan does not use it.", "verdict": "rejected" }
  ],
  "risks": [
    { "id": "R1", "risk": "TEMPLATE: What can go wrong after the change.", "mitigation": "TEMPLATE: How the plan prevents it or finds it early." }
  ],
  "decisions": [
    { "question": "TEMPLATE: A decision.", "answer": "TEMPLATE: The answer.", "source": "user", "reason": "TEMPLATE: Why this answer." }
  ],
  "open": [{ "question": "TEMPLATE: A question that is still open.", "blocks": "TEMPLATE: The step that waits for the answer." }],
  "steps": [{ "status": "todo", "text": "TEMPLATE: One step.", "note": "" }],
  "verification": [
    { "check": "TEMPLATE: A command or a manual check.", "expected": "TEMPLATE: The result that proves the fix.", "proves": ["C1"] }
  ],
  "followUps": [],
  "diagram": "flowchart LR\n  Problem --> Cause --> Fix --> Check"
}
</script>
<script>
const plan = JSON.parse(document.getElementById("plan").textContent);
const element = (name, text, className) => {
  const node = document.createElement(name);
  if (text !== undefined) text.split("`").forEach((part, index) => node.append(index % 2 ? Object.assign(document.createElement("code"), { textContent: part }) : part));
  if (className) node.className = className;
  return node;
};
const badge = (status) => element("span", status, `status ${status.replace(" ", "-")}`);
const table = (headings, rows) => {
  const node = element("table");
  const head = element("tr");
  headings.forEach((heading) => head.append(element("th", heading)));
  node.append(head);
  for (const cells of rows) {
    const row = element("tr");
    for (const cell of cells) {
      const data = element("td", cell instanceof Node ? undefined : cell);
      if (cell instanceof Node) data.append(cell);
      row.append(data);
    }
    node.append(row);
  }
  return node;
};
const either = (items, render, text) => (items.length ? render(items) : element("p", text, "note"));
const bullets = (items) => {
  const node = element("ul");
  items.forEach((item) => node.append(element("li", item)));
  return node;
};
const causeText = (id) => `${id}: ${plan.causes.find((cause) => cause.id === id)?.cause ?? plan.risks.find((risk) => risk.id === id)?.risk ?? "unknown id"}`;
const fixWorks = plan.causes.map((cause) => [
  causeText(cause.id),
  plan.changes.filter((change) => change.addresses.includes(cause.id)).map((change) => `${change.id}: ${change.worksBecause}`).join(" "),
  plan.verification.filter((check) => check.proves.includes(cause.id)).map((check) => check.check).join(" "),
]);
const diagramSlot = element("div");
const sections = [
  ["problem", "The problem", () => [element("p", plan.problem.statement), element("p", plan.problem.impact)]],
  ["evidence", "What happened", () => [table(["Fact", "Source", "Kind"], plan.evidence.map((item) => [item.fact, item.source, item.kind]))]],
  ["causes", "Why it happened", () => [
    table(["Id", "Cause", "Origin"], plan.causes.map((cause) => [cause.id, cause.cause, cause.origin])),
    element("h3", "Causes ruled out"),
    either(plan.ruledOut, (items) => table(["Cause", "Why it is not the cause"], items.map((item) => [item.cause, item.reason])), "None tested."),
  ]],
  ["fix", "The fix", () => [
    element("p", plan.approach),
    table(["Id", "Change", "Files", "Addresses"], plan.changes.map((change) => [change.id, change.change, change.files.join(", "), change.addresses.join(", ")])),
    diagramSlot,
  ]],
  ["works", "Why the fix works", () => [table(["Cause", "How the fix removes it", "Check that proves it"], fixWorks)]],
  ["alternatives", "Alternatives considered", () => [table(["Option", "Trade-off", "Verdict"], plan.alternatives.map((item) => [item.option, item.tradeoff, item.verdict]))]],
  ["risks", "Risks", () => [table(["Id", "Risk", "Mitigation"], plan.risks.map((item) => [item.id, item.risk, item.mitigation]))]],
  ["decisions", "Decisions", () => [either(plan.decisions, (items) => table(["Question", "Answer", "Source", "Reason"], items.map((item) => [item.question, item.answer, item.source, item.reason])), "No decisions yet.")]],
  ["open", "Open questions", () => [either(plan.open, (items) => table(["Question", "What it blocks"], items.map((item) => [item.question, item.blocks])), "No open questions.")]],
  ["steps", "Steps", () => [table(["Status", "Step", "Note"], plan.steps.map((step) => [badge(step.status), step.text, step.note]))]],
  ["verification", "Verification", () => [table(["Check", "Expected result", "Proves"], plan.verification.map((check) => [check.check, check.expected, check.proves.map(causeText).join(" ")]))]],
  ["follow-ups", "Follow-ups", () => [either(plan.followUps, bullets, "None.")]],
];

document.title = plan.title;
document.getElementById("status").replaceWith(badge(plan.status));
const headerText = [["title", plan.title], ["summary", plan.summary], ["plan-path", plan.planPath], ["updated", plan.updated]];
headerText.forEach(([id, value]) => document.getElementById(id).append(element("span", value)));

const stepsLeft = plan.steps.filter((step) => !["done", "skipped"].includes(step.status)).length;
const counts = [[plan.causes.length, "causes"], [plan.steps.filter((step) => step.status === "done").length, "steps done"], [stepsLeft, "steps left"], [plan.open.length, "open questions"]];
for (const [count, label] of counts) {
  const node = element("div", undefined, "card");
  node.append(element("b", String(count)), element("span", label));
  document.getElementById("counts").append(node);
}

for (const [id, heading, render] of sections) {
  const section = Object.assign(element("section"), { id });
  const body = element("div", undefined, "card scroll");
  body.append(...render());
  section.append(element("h2", heading), body);
  document.getElementById("sections").append(section);
  document.getElementById("contents").append(Object.assign(element("a", heading), { href: `#${id}` }));
}

if (plan.diagram) {
  const figure = element("div");
  const note = element("p", "The diagram shows as source text until the pinned Mermaid file loads.", "note");
  figure.id = "diagram";
  diagramSlot.append(element("h3", "Diagram"), figure, note, element("pre", plan.diagram));

  const script = Object.assign(document.createElement("script"), {
    src: "https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.min.js",
    integrity: "sha384-EbBpjO7rlR6eqZEcG7GaPpyk9H9WrMyPWX4d3KvPYltgt8Z8l0z6R56B1qP40pR4",
    crossOrigin: "anonymous",
  });
  script.onload = async () => {
    const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", htmlLabels: false, flowchart: { htmlLabels: false }, theme: dark ? "dark" : "default" });
    const { svg } = await window.mermaid.render("plan-diagram", plan.diagram);
    const image = Object.assign(document.createElement("img"), { alt: "Plan diagram", src: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}` });
    figure.replaceChildren(image);
    note.textContent = "Diagram source:";
  };
  script.onerror = () => {
    note.textContent = "Mermaid did not load, so the diagram shows as source text.";
  };
  document.head.append(script);
}
</script>
</body>
</html>
