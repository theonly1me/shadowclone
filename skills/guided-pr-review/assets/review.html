<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; font-src 'none'; base-uri 'none'"
    />
    <title>{{TITLE}}</title>
    <style>
      {{STYLE}}
    </style>
  </head>
  <body>
    <p id="storage-warning" class="storage-warning" role="alert" hidden></p>
    {{BODY}}
    <dialog id="evidence-reader">
      <div class="dialog-title">
        <h2>Source evidence</h2>
        <button type="button" id="close-evidence" aria-label="Close source evidence">×</button>
      </div>
      <div id="evidence-reader-body"></div>
    </dialog>
    <dialog id="note-editor">
      <form id="note-form">
        <div class="dialog-title">
          <h2>Add your note</h2>
          <button type="button" id="cancel-note" aria-label="Close">×</button>
        </div>
        <label
          >Target PR
          <select id="note-pr" required></select
        ></label>
        <blockquote id="note-quote"></blockquote>
        <label
          >Your rough comment
          <textarea
            id="note-body"
            rows="5"
            required
            placeholder="Write the concern or question in your own words."
          ></textarea>
        </label>
        <button type="submit" class="primary">Save note</button>
      </form>
    </dialog>
    <script type="application/json" id="guided-review">
      {{DATA}}
    </script>
    <script type="module" id="review-runtime"></script>
  </body>
</html>
